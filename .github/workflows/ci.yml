name: Datédex CI

on:
  push:
    branches: [main, 'feat/*', 'fix/*']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Boundaries, Tests & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (App + API)
        run: npm run typecheck

      - name: ESLint & JSDoc Verification
        run: npm run lint

      - name: SoC-006 Dependency Boundary Check
        run: npm run check:boundaries

      - name: Vitest Unit & Integration Suite
        run: npm run test

      - name: Public-Repo Secret & Auth Policy Scan
        run: npm run check:secrets

      - name: Production Vite PWA Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright Mobile Viewport E2E Suite
        run: npm run test:e2e
